name: Build Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev

      - name: Configure application
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLV_BUILD_KIND=dynamic

      - name: Build application
        run: cmake --build build-linux --parallel 2

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build-linux/CossacksLogViewer dist/CossacksLogViewer
          chmod +x dist/CossacksLogViewer
          ldd dist/CossacksLogViewer

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: CossacksLogViewer-Linux-x64
          path: dist/CossacksLogViewer
          if-no-files-found: error
