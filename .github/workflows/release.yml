name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build Release
        run: |
          cmake --build build --config Release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build\Release\CossacksLogViewer.exe"

          if (!(Test-Path $exe)) {
              Write-Error "Executable not found: $exe"
              exit 1
          }

          Write-Host "Found: $exe"

      - name: Prepare package
        shell: pwsh
        run: |
          $package = "CossacksLogViewer-${{ github.ref_name }}-windows-x64"

          New-Item -ItemType Directory -Force `
            -Path "release\$package" | Out-Null

          Copy-Item `
            "build\Release\*" `
            "release\$package\" `
            -Recurse `
            -Force

      - name: Create ZIP
        shell: pwsh
        run: |
          $package = "CossacksLogViewer-${{ github.ref_name }}-windows-x64"

          Compress-Archive `
            -Path "release\$package" `
            -DestinationPath "release\$package.zip" `
            -CompressionLevel Optimal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Cossacks Log Viewer ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release/CossacksLogViewer-${{ github.ref_name }}-windows-x64.zip