name: Release

on:
  push:
    branches:
      - develop
    tags:
      - 'mod-launcher-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3
  QT_STATIC_DIR: C:\Qt\6.8.3-static-x86

jobs:
  build-windows-static:
    name: Build Windows static x86
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # Qt takes a long time to build from source, so cache the installed static kit.
      - name: Cache static Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_STATIC_DIR }}
          key: qt-${{ env.QT_VERSION }}-static-msvc2022-x86-v1

      - name: Download Qt sources
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://download.qt.io/archive/qt/6.8/${{ env.QT_VERSION }}/submodules/qtbase-everywhere-src-${{ env.QT_VERSION }}.zip" `
            -OutFile qtbase.zip

          Expand-Archive qtbase.zip -DestinationPath qt-src

      - name: Build static Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qt-build | Out-Null
          Set-Location qt-build

          & "$env:GITHUB_WORKSPACE\qt-src\qtbase-everywhere-src-$env:QT_VERSION\configure.bat" `
            -prefix "$env:QT_STATIC_DIR" `
            -release `
            -static `
            -static-runtime `
            -opensource `
            -confirm-license `
            -optimize-size `
            -nomake examples `
            -nomake tests `
            -no-openssl `
            -cmake-generator Ninja

          cmake --build . --parallel
          cmake --install .

      - name: Configure application
        shell: pwsh
        run: |
          $cmakeArgs = @(
            "-S", ".",
            "-B", "build-static",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCLV_BUILD_KIND=static"
          )

          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME.StartsWith("mod-launcher-")) {
            $prefix = "mod-launcher-"
            $appVersion = $env:GITHUB_REF_NAME.Substring($prefix.Length)
            $cmakeArgs += "-DCLV_APP_VERSION=$appVersion"
          }

          & "$env:QT_STATIC_DIR\bin\qt-cmake.bat" @cmakeArgs

      - name: Build application
        run: cmake --build build-static --parallel 2

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          $exe = Get-ChildItem build-static -Recurse -Filter CossacksModLauncher.exe |
            Select-Object -First 1

          if (-not $exe) {
            throw "CossacksModLauncher.exe not found"
          }

          Copy-Item $exe.FullName dist\CossacksModLauncher.exe

          $dependencies = dumpbin /DEPENDENTS dist\CossacksModLauncher.exe | Out-String
          $dependencies

          if ($dependencies -match 'Qt[56].*\.dll|VCRUNTIME|MSVCP') {
            throw "Static artifact still depends on Qt or MSVC runtime DLLs."
          }

          Copy-Item $exe.FullName dist\CossacksModLauncher.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CossacksModLauncher-Windows-x86
          path: dist/CossacksModLauncher.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl ninja-build qt6-base-dev qmake6

      - name: Configure application
        run: |
          cmake_args=(
            -S .
            -B build-linux
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCLV_BUILD_KIND=dynamic
          )

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == mod-launcher-* ]]; then
            cmake_args+=("-DCLV_APP_VERSION=${GITHUB_REF_NAME#mod-launcher-}")
          fi

          cmake "${cmake_args[@]}"

      - name: Build application
        run: cmake --build build-linux --parallel 2

      - name: Prepare Linux binary archive
        run: |
          mkdir -p dist
          cp build-linux/CossacksModLauncher dist/CossacksModLauncher
          chmod +x dist/CossacksModLauncher
          ldd dist/CossacksModLauncher
          tar -C dist -czf dist/CossacksModLauncher-Linux-x64.tar.gz CossacksModLauncher

      - name: Download AppImage packaging tools
        run: |
          curl --fail --location --show-error \
            -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl --fail --location --show-error \
            -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage artifact
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir -p dist

          qmake_path="$(command -v qmake6 || true)"
          if [[ -z "$qmake_path" ]]; then
            qmake_path="$(command -v qmake || true)"
          fi
          if [[ -z "$qmake_path" ]]; then
            echo "qmake was not found; cannot bundle Qt into the AppImage."
            exit 1
          fi

          app_version="dev-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == mod-launcher-* ]]; then
            app_version="${GITHUB_REF_NAME#mod-launcher-}"
          fi

          mkdir -p appimage-bin
          cp build-linux/CossacksModLauncher appimage-bin/CossacksModLauncher
          chmod +x appimage-bin/CossacksModLauncher

          VERSION="$app_version" QMAKE="$qmake_path" ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable appimage-bin/CossacksModLauncher \
            --desktop-file packaging/linux/cossacks-mod-launcher.desktop \
            --icon-file packaging/cossacks-mod-launcher.png \
            --library /usr/lib/x86_64-linux-gnu/libssl.so.3 \
            --library /usr/lib/x86_64-linux-gnu/libcrypto.so.3 \
            --plugin qt \
            --output appimage

          appimage="$(find . -maxdepth 1 -type f -name '*.AppImage' ! -name 'linuxdeploy*.AppImage' | head -n 1)"
          if [[ -z "$appimage" ]]; then
            echo "linuxdeploy did not produce an AppImage."
            exit 1
          fi

          mv "$appimage" dist/CossacksModLauncher-Linux-x64.AppImage
          chmod +x dist/CossacksModLauncher-Linux-x64.AppImage
          cp packaging/linux/install.sh dist/install.sh
          cp packaging/cossacks-mod-launcher.png dist/cossacks-mod-launcher.png
          printf '%s\n' "$app_version" > dist/VERSION
          chmod +x dist/install.sh
          tar -C dist -czf \
            dist/CossacksModLauncher-Linux-x64.AppImage.tar.gz \
            CossacksModLauncher-Linux-x64.AppImage \
            install.sh \
            cossacks-mod-launcher.png \
            VERSION

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: CossacksModLauncher-Linux-x64
          path: |
            dist/CossacksModLauncher-Linux-x64.tar.gz
            dist/CossacksModLauncher-Linux-x64.AppImage.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'mod-launcher-')
    needs:
      - build-windows-static
      - build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        run: ls -la release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --latest
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --latest \
              --verify-tag
          fi
