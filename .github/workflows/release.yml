name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build Release
        run: |
          cmake --build build --config Release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build\Release\CossacksLogViewer.exe"

          if (!(Test-Path $exe)) {
              Write-Error "Executable not found: $exe"
              exit 1
          }

          Write-Host "Found: $exe"

      - name: Prepare package
        shell: pwsh
        run: |
          $package = "CossacksLogViewer-${{ github.ref_name }}-windows-x64"

          New-Item -ItemType Directory -Force `
            -Path "release\$package" | Out-Null

          Copy-Item `
            "build\Release\*" `
            "release\$package\" `
            -Recurse `
            -Force

      - name: Create ZIP
        shell: pwsh
        run: |
          $package = "CossacksLogViewer-${{ github.ref_name }}-windows-x64"

          Compress-Archive `
            -Path "release\$package" `
            -DestinationPath "release\$package.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release/CossacksLogViewer-${{ github.ref_name }}-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux x64 (AppImage)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt and tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            qt6-base-dev \
            patchelf \
            desktop-file-utils

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: |
          cmake --build build --parallel

      - name: Verify executable
        run: |
          test -x build/CossacksLogViewer
          echo "Found: build/CossacksLogViewer"

      - name: Prepare AppDir
        run: |
          set -e
          mkdir -p AppDir/usr/bin
          cp build/CossacksLogViewer AppDir/usr/bin/CossacksLogViewer

      - name: Add desktop entry and icon
        run: |
          set -e
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cat > AppDir/usr/share/applications/cossackslogviewer.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Cossacks Log Viewer
          Comment=Cossacks: Back to War log viewer
          Exec=CossacksLogViewer
          Icon=cossackslogviewer
          Terminal=false
          Categories=Utility;Development;
          EOF

          python3 - <<'PY'
          import zlib
          import struct


          def chunk(tag, data):
              return (
                  struct.pack(">I", len(data))
                  + tag
                  + data
                  + struct.pack(">I", zlib.crc32(tag + data) & 0xFFFFFFFF)
              )


          w = h = 256
          raw = b""
          for y in range(h):
              raw += b"\x00"
              for x in range(w):
                  # Simple two-tone placeholder icon; replace with real branding later.
                  r, g, b = (52, 120, 246) if x <= y else (38, 78, 165)
                  raw += bytes((r, g, b, 255))

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(raw))
              + chunk(b"IEND", b"")
          )

          with open(
              "AppDir/usr/share/icons/hicolor/256x256/apps/cossackslogviewer.png", "wb"
          ) as f:
              f.write(png)
          PY

      - name: Download linuxdeploy
        run: |
          set -e
          curl -sSL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSL -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        run: |
          set -e
          # linuxdeploy-plugin-qt finds Qt through qmake; expose qmake6 as qmake.
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v qmake6)" "$HOME/.local/bin/qmake"
          export PATH="$HOME/.local/bin:$PATH"

          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/cossackslogviewer.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/cossackslogviewer.png \
            --output appimage

          appimage="$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*' -print -quit)"
          test -n "$appimage"
          mv "$appimage" "CossacksLogViewer-${{ github.ref_name }}-linux-x86_64.AppImage"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: CossacksLogViewer-${{ github.ref_name }}-linux-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          path: release/

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: release/

      - name: List release assets
        run: |
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Cossacks Log Viewer ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release/CossacksLogViewer-${{ github.ref_name }}-windows-x64.zip
            release/CossacksLogViewer-${{ github.ref_name }}-linux-x86_64.AppImage